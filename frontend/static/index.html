<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GourmetGenie</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #e65100;
    --accent-dark: #bf360c;
    --accent-light: #fff3e0;
    --accent-subtle: #ffe0b2;
    --bg: #fdfbf7;
    --surface: #ffffff;
    --border: #f0e6dc;
    --border-dark: #e0d0c1;
    --text-primary: #2d2621;
    --text-secondary: #756a63;
    --user-bubble: #e65100;
    --agent-bubble: #ffffff;
    --shadow-sm: 0 1px 3px rgba(60, 40, 20, 0.05);
    --shadow-md: 0 4px 12px rgba(60, 40, 20, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #ff9800, #e65100);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 2px 6px rgba(230, 81, 0, 0.25);
  }
  .brand-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-dark);
    margin: 0;
  }
  .brand-tagline {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Dialogue Message Rows with Avatars */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.agent .avatar {
    background: #fff8e1;
    border: 1px solid #ffe082;
  }
  .msg-row.user .avatar {
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .msg-row.user .bubble-wrap {
    align-items: flex-end;
  }

  .bubble {
    display: inline-block;
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.95rem;
  }
  .msg-row.agent .bubble {
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: linear-gradient(135deg, #f57c00, #e65100);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(230, 81, 0, 0.2);
  }
  /* Rich A2UI Card representation */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Chat Footer & Input Controls */
  .chat-footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 0.75rem 1.5rem 1rem;
    box-shadow: 0 -2px 10px rgba(60, 40, 20, 0.03);
  }
  .examples-bar {
    max-width: 820px;
    margin: 0 auto 0.65rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .examples-bar::-webkit-scrollbar { height: 4px; }
  .examples-bar::-webkit-scrollbar-thumb { background: #e0d0c1; border-radius: 4px; }
  .example-chip {
    background: var(--accent-light);
    color: var(--accent-dark);
    border: 1px solid var(--accent-subtle);
    border-radius: 20px;
    padding: 0.4rem 0.85rem;
    font-size: 0.825rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .example-chip:hover {
    background: #ffe0b2;
    border-color: #ffb74d;
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  form {
    display: flex;
    gap: 0.65rem;
    max-width: 820px;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #faf7f2;
    transition: all 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.12);
  }
  button[type="submit"] {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f57c00, #e65100);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(230, 81, 0, 0.25);
    transition: all 0.15s ease;
  }
  button[type="submit"]:hover {
    background: linear-gradient(135deg, #e65100, #d84315);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(230, 81, 0, 0.3);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: box-shadow 0.2s ease;
  }
  .a2card:hover {
    box-shadow: 0 6px 16px rgba(60, 40, 20, 0.1);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #4e342e; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">🍳</div>
    <div>
      <h1 class="brand-title">GourmetGenie</h1>
      <div class="brand-tagline">AI Personal Chef &amp; Meal Planner</div>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="chat-footer">
  <div class="examples-bar">
    <button type="button" class="example-chip" data-prompt="Suggest a gluten-free Italian dinner recipe and show its nutrition.">🍝 Gluten-free dinner &amp; nutrition</button>
    <button type="button" class="example-chip" data-prompt="Create a weekly grocery shopping list for a family of 4.">🛒 Weekly grocery list</button>
    <button type="button" class="example-chip" data-prompt="Find nearby grocery stores and specialty markets around us.">📍 Find nearby markets</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask GourmetGenie for recipes, meal plans, or grocery lists…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar");
  avatar.textContent = (who === "agent" ? "👨‍🍳" : "👤");
  
  const wrap = el("div", "bubble-wrap");
  const b = el("div", "bubble");
  wrap.appendChild(b);

  row.appendChild(avatar);
  row.appendChild(wrap);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

// Clickable example prompt chips
document.querySelectorAll(".example-chip").forEach((btn) => {
  btn.addEventListener("click", () => {
    const prompt = btn.getAttribute("data-prompt");
    if (prompt) sendMessage(prompt);
  });
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  sendMessage(text);
});
</script>
</body>
</html>
